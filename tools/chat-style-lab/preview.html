<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local chat style lab</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #dce4df; color: #203a2a; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 20px; background: #fff; border-bottom: 1px solid #c4d5ca; }
    strong { font-size: 16px; }
    .badge { padding: 4px 8px; color: #245b36; background: #eaf5ee; border-radius: 6px; font-size: 11px; font-weight: 700; }
    label { display: flex; align-items: center; gap: 6px; }
    select, button { min-height: 36px; border: 1px solid #b6cbbb; border-radius: 8px; padding: 6px 10px; font: inherit; background: #fff; color: inherit; }
    button { color: white; background: #0a6e30; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: .5; cursor: wait; }
    :focus-visible { outline: 3px solid #0a6e30; outline-offset: 3px; }
    #status { margin: 0; padding: 8px 20px; background: #edf5f0; font-size: 12px; }
    main { display: flex; justify-content: center; height: calc(100dvh - var(--toolbar-height, 110px)); min-height: 250px; }
    iframe { width: 100%; height: 100%; border: 0; background: white; box-shadow: 0 0 30px #203a2a20; }
    iframe.mobile { max-width: 375px; }
    @media (max-width: 600px) { header { gap: 8px; padding: 10px; } strong { font-size: 14px; } #status { padding: 8px 10px; } }
  </style>
  <script src="/__mock/preview.js" defer></script>
</head>
<body>
  <header>
    <strong>Chat style lab</strong>
    <span class="badge">LOCAL MOCK ONLY</span>
    <label>Scenario
      <select id="scenario">
        <option value="agui-help-holder">AWS help: holder advice + illustrations</option>
        <option value="agui-help-video">AWS help: beep advice + video</option>
        <option value="agui-help-install">AWS help: installation steps + media</option>
        <option value="journey">Journey image + summary</option>
        <option value="compare">Pass comparison</option>
        <option value="notice">Notice checklist</option>
        <option value="image">Image + broken-image fallback</option>
        <option value="custom">Synthetic unmapped CUSTOM event</option>
        <option value="agui-route">AWS AG-UI route + follow-ups</option>
        <option value="agui-statement">AWS AG-UI statement + follow-ups</option>
        <option value="interrupted">Interrupted response</option>
        <option value="rpc-error">AG-UI agent error after partial text</option>
        <option value="slow">Slow streamed response</option>
        <option value="error">Failure + retry</option>
      </select>
    </label>
    <button id="run" disabled>Run mock</button>
    <label><input id="enhanced" type="checkbox"> Experimental styles</label>
    <label><input id="mobile" type="checkbox"> Mobile width</label>
    <a href="/__mock/renderer-tests.html">Renderer and migration checks</a>
  </header>
  <p id="status" role="status">Loading local site. No live chat requests are allowed.</p>
  <main><iframe src="/" title="Local-only chat style preview"></iframe></main>
</body>
</html>
